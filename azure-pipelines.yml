    steps:

    - checkout: self

    - task: Bash@3
      target: host
      displayName: 'Reclaim runner host disk space'
      inputs:
        targetType: 'inline'
        script: |
          echo "[INFO] Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            2>/dev/null || true
          echo "[INFO] Disk space after cleanup:"
          df -h /

    # Download cached PBF from the osm-download pipeline (definition 9: krizleebear.osm-download-pbf).
    # Never fetch directly from Geofabrik here — that is the download pipeline's job.
    # Download raw PBF from osm-download pipeline when skipOsmiumFilter is false
    - ${{ if or(eq(parameters.downloadBuildId, 'latest'), eq(parameters.downloadBuildId, 'auto')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download cached OSM PBF (from osm-download pipeline - latest)'
        condition: ${{ eq(parameters.skipOsmiumFilter, false) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '9'
          buildVersionToDownload: 'latest'
          artifactName: 'osm-data-$(OSM_REGION)'
          targetPath: '$(System.DefaultWorkingDirectory)'
    - ${{ if not(or(eq(parameters.downloadBuildId, 'latest'), eq(parameters.downloadBuildId, 'auto'))) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download cached OSM PBF (from osm-download pipeline - build ${{ parameters.downloadBuildId }})'
        condition: ${{ eq(parameters.skipOsmiumFilter, false) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          pipeline: '9'
          buildId: '${{ parameters.downloadBuildId }}'
          artifactName: 'osm-data-$(OSM_REGION)'
          targetPath: '$(System.DefaultWorkingDirectory)'

    # Download pre-filtered PBF artifacts when skipOsmiumFilter is true
    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download pre-filtered PBF artifacts'
      condition: ${{ eq(parameters.skipOsmiumFilter, true) }}
      inputs:
        buildType: 'current'
        artifact: 'osm-pbf-$(COUNTRY_CODE)-$(OSM_REGION)'
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      enabled: true
      displayName: 'Convert PBF to GeoParquet'
      env:
        # Hosted ubuntu agents provide 2 vCPU / 7 GB RAM. The DuckDB budget is
        # pinned explicitly so that runs stay comparable and so that DuckDB
        # leaves headroom for the GDAL OSM node cache instead of claiming 80%
        # of system memory. Capping threads also caps the number of concurrent
        # sort partitions, and with it peak scratch disk usage.
        DUCKDB_MEMORY_LIMIT: '4GB'
        DUCKDB_THREADS: '2'
        RESOURCE_LOG: '$(System.DefaultWorkingDirectory)/resource-log-$(COUNTRY_CODE)-$(OSM_REGION).csv'
        RESOURCE_INTERVAL: '15'
      inputs:
        targetType: 'inline'
        script: |
          set -e

          ADDRESSES_PBF="$(COUNTRY_CODE)_$(OSM_REGION).addresses.pbf"
          ROADS_PBF="$(COUNTRY_CODE)_$(OSM_REGION).roads.pbf"
          ENTRANCES_PBF="$(COUNTRY_CODE)_$(OSM_REGION).entrances.pbf"
          OUTPUT_PARQUET="$(COUNTRY_CODE)_$(OSM_REGION).addresses.parquet"
          SKIP_OSMIUM="${{ parameters.skipOsmiumFilter }}"

          if [ "$SKIP_OSMIUM" = "false" ] || [ "$SKIP_OSMIUM" = "False" ]; then
            FOUND_PBF=$(find . -name "$(OSM_REGION).osm.pbf" 2>/dev/null | head -n 1)
            if [ -n "$FOUND_PBF" ] && [ -f "$FOUND_PBF" ]; then
              INPUT_PBF="$FOUND_PBF"
            else
              INPUT_PBF="osm-data-$(OSM_REGION)/$(OSM_REGION).osm.pbf"
            fi

            if [ ! -f "$INPUT_PBF" ]; then
              echo "****************************************************************"
              echo " ERROR: Missing PBF file for region '$(OSM_REGION)'!"
              echo ""
              echo " File '$(OSM_REGION).osm.pbf' was not found in workspace."
              echo ""
              echo " Cause:"
              echo "   The osm-download pipeline (definition 3) has not cached"
              echo "   the PBF artifact for '$(OSM_REGION)', or the artifact expired."
              echo ""
              echo " Solution:"
              echo "   Run the osm-download pipeline (definition 3) first to"
              echo "   populate cached PBF artifacts for '$(OSM_REGION)'."
              echo "****************************************************************"
              exit 1
            fi

            echo "[INFO] Found input PBF: $INPUT_PBF"
            echo "[INFO] Filtering address features via osmium..."
            osmium tags-filter "$INPUT_PBF" \
              n/addr:housenumber wr/addr:housenumber \
              -o "$ADDRESSES_PBF" --overwrite

            echo "[INFO] Filtering road features via osmium..."
            osmium tags-filter "$INPUT_PBF" \
              w/highway=residential,unclassified,tertiary,tertiary_link,secondary,secondary_link,primary,primary_link,trunk,trunk_link,living_street,service,pedestrian,track \
              -o "$ROADS_PBF" --overwrite

            echo "[INFO] Filtering entrance features via osmium..."
            osmium tags-filter "$INPUT_PBF" \
              n/entrance n/barrier=gate,lift_gate \
              -o "$ENTRANCES_PBF" --overwrite

            echo "[INFO] Reclaiming disk space: removing raw input PBF immediately..."
            rm -rf "osm-data-$(OSM_REGION)" "$(OSM_REGION).osm.pbf"
          else
            echo "[INFO] Skipping Osmium filter stage (using pre-filtered PBF artifacts)."
            for PBF_NAME in "$ADDRESSES_PBF" "$ROADS_PBF" "$ENTRANCES_PBF"; do
              if [ ! -f "$PBF_NAME" ]; then
                FOUND=$(find . -name "$PBF_NAME" 2>/dev/null | head -n 1)
                if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
                  mv "$FOUND" .
                fi
              fi
              if [ ! -f "$PBF_NAME" ]; then
                echo "****************************************************************"
                echo " ERROR: Pre-filtered PBF file '$PBF_NAME' not found!"
                echo "****************************************************************"
                exit 1
              fi
            done
          fi

          echo "[INFO] Converting filtered PBFs to GeoParquet via DuckDB..."
          chmod +x scripts/convert.sh
          ./scripts/convert.sh "$ADDRESSES_PBF" "$ROADS_PBF" "$ENTRANCES_PBF" "$OUTPUT_PARQUET" "$(COUNTRY_CODE)"

          echo "[INFO] Validating output GeoParquet files..."
          python3 scripts/validate_parquet.py "$(COUNTRY_CODE)_$(OSM_REGION)".*.parquet --fail-on-error

          mkdir -p "artifacts-$(COUNTRY_CODE)-$(OSM_REGION)"
          cp "$(COUNTRY_CODE)_$(OSM_REGION)".*.parquet "artifacts-$(COUNTRY_CODE)-$(OSM_REGION)/"

          mkdir -p "pbf-$(COUNTRY_CODE)-$(OSM_REGION)"
          cp "$ADDRESSES_PBF" "$ROADS_PBF" "$ENTRANCES_PBF" "pbf-$(COUNTRY_CODE)-$(OSM_REGION)/" 2>/dev/null || true

    # The filtered PBFs are the expensive intermediate (after long osmium passes).
    # Retaining them lets a re-run with skipOsmiumFilter=true jump straight to the
    # export stage. Safe to publish unconditionally: this artifact feeds re-runs
    # of this pipeline only, never the release pipeline's aggregation.
    - ${{ if eq(parameters.skipOsmiumFilter, false) }}:
      - task: PublishPipelineArtifact@1
        enabled: true
        displayName: 'Publish pre-filtered PBF artifacts'
        condition: always()
        # The PBFs are absent when the osmium stage itself failed; a missing path
        # must not mask the original error.
        continueOnError: true
        inputs:
          targetPath: 'pbf-$(COUNTRY_CODE)-$(OSM_REGION)'
          artifact: 'osm-pbf-$(COUNTRY_CODE)-$(OSM_REGION)'
          publishLocation: 'pipeline'

    # Deliberately left on the default succeeded() condition: the release
    # pipeline aggregates these per-region artifacts, so publishing a partial
    # layer set would let an incomplete dataset reach a release.
    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Publish GeoParquet artifacts (addresses, roads, entrances)'
      inputs:
        targetPath: 'artifacts-$(COUNTRY_CODE)-$(OSM_REGION)'
        artifact: 'osm-parquet-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    # Must stay ahead of the cleanup step below, which wipes the working
    # directory unconditionally. Without this the resource log is destroyed on
    # every run that does not take the agent offline outright, so the peak
    # memory and scratch figures never reach anyone.
    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Publish resource log'
      condition: always()
      continueOnError: true
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/resource-log-$(COUNTRY_CODE)-$(OSM_REGION).csv'
        artifact: 'resource-log-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*


