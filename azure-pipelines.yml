# OSM address export pipeline: PBF -> GeoParquet (DuckDB-based, no Java)
# Converts cached OSM PBF artifacts from the osm-download pipeline (definition 3)
# into ZSTD-compressed GeoParquet files containing address-tagged features.
#
# Prerequisites:
#   The osm2parquet Docker image must be built and pushed to both registries:
#     docker build -t krizleebear/osm2parquet:vX.Y.Z docker/osm2parquet/
#     docker push krizleebear/osm2parquet:vX.Y.Z                   # Docker Hub
#     docker tag krizleebear/osm2parquet:vX.Y.Z ghcr.io/krizleebear/osm2parquet:vX.Y.Z
#     docker push ghcr.io/krizleebear/osm2parquet:vX.Y.Z           # GHCR (primary)
#   GHCR is used as primary registry (no rate limits, no mirror.gcr.io flakiness).
#   mirror.gcr.io is retained as fallback in the warmup job.
#
# Stages:
#   warmup  -- Verify container image availability & host disk reclaim
#   convert -- Per-region PBF -> Parquet conversion (Container-Job-Pattern)
trigger: none
pr: none

parameters:
- name: skipOsmiumFilter
  displayName: 'Skip Osmium filtering (use pre-filtered PBF pipeline artifacts)'
  type: boolean
  default: false
- name: downloadBuildId
  displayName: 'Specific build ID of osm-download-pbf pipeline (definition 9) or latest'
  type: string
  default: 'latest'

- name: usOnly
  displayName: 'Expand only the US region (resource measurement / debug runs)'
  type: boolean
  default: false

pool:
  vmImage: 'ubuntu-latest'

resources:
  containers:
  # Primary registry: GHCR (no rate limits, no mirror.gcr.io flakiness).
  # Fallback: mirror.gcr.io is attempted in the warmup job for cache pre-warming.
  - container: osm2parquet
    # krizleebear/osm2parquet:v1.1.0 (standard Docker Schema 2 format)
    image: ghcr.io/krizleebear/osm2parquet:v1.1.0

stages:
# ---------------------------------------------------------------------------
# Stage 1: Verify container image availability & host disk reclaim
# Pulls from GHCR (primary). Falls back to mirror.gcr.io if GHCR is
# unavailable. Fails fast with a clear message if both registries fail.
# ---------------------------------------------------------------------------
- stage: warmup
  displayName: 'Verify container image availability'

  jobs:
  - job: warmup
    displayName: 'Verify image pull (GHCR primary, mirror.gcr.io fallback)'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none

    - task: Bash@3
      displayName: 'Pull image: GHCR primary, mirror.gcr.io fallback'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          GHCR_IMAGE="ghcr.io/krizleebear/osm2parquet:v1.1.0"
          MIRROR_IMAGE="mirror.gcr.io/krizleebear/osm2parquet:v1.1.0"

          pull_with_retry() {
            local IMAGE="$1"
            local MAX_RETRIES=3
            local RETRY_COUNT=0
            until docker pull "$IMAGE"; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "[WARN] Pull failed for $IMAGE after $MAX_RETRIES attempts."
                return 1
              fi
              echo "[WARN] Pull failed for $IMAGE. Retrying in 15 seconds ($RETRY_COUNT/$MAX_RETRIES)..."
              sleep 15
            done
            return 0
          }

          echo "[INFO] Attempting pull from GHCR (primary): $GHCR_IMAGE"
          if pull_with_retry "$GHCR_IMAGE"; then
            echo "[OK] Image available on GHCR."
            exit 0
          fi

          echo "[WARN] GHCR unavailable. Attempting fallback: $MIRROR_IMAGE"
          if pull_with_retry "$MIRROR_IMAGE"; then
            echo "[OK] Image available on mirror.gcr.io (fallback)."
            exit 0
          fi

          echo "****************************************************************"
          echo " ERROR: Failed to pull image from both registries!"
          echo "   Primary:  $GHCR_IMAGE"
          echo "   Fallback: $MIRROR_IMAGE"
          echo " Remediation: Verify that the image is published on GHCR and"
          echo "   Docker Hub, and that mirror.gcr.io has no ongoing outage."
          echo "****************************************************************"
          exit 1

    - task: Bash@3
      displayName: 'Verify host disk reclaim'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          echo "=== DISK SPACE BEFORE RECLAIM ==="
          df -h /
          echo ""
          echo "[INFO] Removing unused pre-installed SDKs (.NET, Android, GHC, Boost, toolcache)..."
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            2>/dev/null || true
          echo ""
          echo "=== DISK SPACE AFTER RECLAIM ==="
          df -h /

# ---------------------------------------------------------------------------
# Stage 2: Fast-fail preflight (YAML syntax & unit tests)
# ---------------------------------------------------------------------------
- stage: preflight
  displayName: 'Preflight & Unit Tests'
  dependsOn: warmup
  jobs:
  - job: test_and_validate
    displayName: 'Validate YAML & Run Unit Tests'
    timeoutInMinutes: 5
    workspace:
      clean: all
    container: osm2parquet
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail
        echo "=== 1. Validating Azure Pipelines YAML Syntax ==="
        python3 scripts/validate_azure_yaml.py azure-pipelines.yml
        python3 scripts/validate_azure_yaml.py azure-pipelines-release.yml

        echo "=== 2. Running Python Unit Test Suite ==="
        PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_*.py'
      displayName: 'Fast-fail preflight: YAML validation & Unit Tests'

# ---------------------------------------------------------------------------
# Stage 3: Convert PBF -> GeoParquet (per region, parallel matrix)
# ---------------------------------------------------------------------------
- stage: convert
  displayName: 'Convert OSM PBF to GeoParquet'
  dependsOn:
  - warmup
  - preflight
  condition: succeeded()

  jobs:
  - job: convert
    displayName: 'PBF -> Parquet'
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osm2parquet

    strategy:
      matrix:
        # Single-region debug mode. The US extract is the only one that has
        # taken a build agent offline, so it must be reproducible on its own
        # without queueing the remaining 168 regions.
