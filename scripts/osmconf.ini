; OGR/GDAL OSM driver configuration for DuckDB ST_Read
; Exposes tags as dedicated SQL columns for points, multipolygons, and lines layers.
; Used by export_*.sql via open_options=['CONFIG_FILE=__OSMCONF__']

; Treat closed ways with these tags (especially building and addr:housenumber) as polygons
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform,addr:housenumber

[points]
osm_id=yes
attributes=name,ref,entrance,barrier,addr:street,addr:housenumber,addr:postcode,addr:city,addr:place
other_tags=yes

[multipolygons]
osm_id=yes
osm_way_id=yes
attributes=name,type,boundary,building,addr:street,addr:housenumber,addr:postcode,addr:city,addr:place
other_tags=yes

[lines]
osm_id=yes
attributes=name,highway,oneway,service,access,motor_vehicle,motorcar
other_tags=no

[other_relations]
attributes=
other_tags=no
