name: CI Preflight & Unit Tests

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Unit & Invariant Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml duckdb

      - name: Validate Azure DevOps YAML Syntax
        run: |
          python3 scripts/validate_azure_yaml.py

      - name: Run Unit Tests
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_*.py'
